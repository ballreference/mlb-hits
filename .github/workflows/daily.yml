name: Daily hit probabilities
on:
  schedule:
    - cron: '23 0,13,16,19,21 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Days to backtest (0 for a normal run)'
        default: '0'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          DATE=$(TZ=America/New_York date +%F)
          mkdir -p docs data/predictions data/graded
          python3 mlb_hit_probs.py --date "$DATE" --projected --min-prob 0.70 --keep-all --format json --out data/predictions/$DATE.json
          python3 mlb_grade.py --today data/predictions/$DATE.json --date "$DATE" --backfill ${{ github.event.inputs.backfill || '0' }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A docs data
          git commit -m "Update" || exit 0
          git push
